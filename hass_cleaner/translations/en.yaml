configuration:
  min_temp_age_days:
    name: Minimum age for temporary files
    description: Files younger than this remain excluded from recommended cleanup categories.
  min_log_age_days:
    name: Minimum age for old logs
    description: Log files younger than this remain excluded.
  deletion_mode:
    name: Deletion policy
    description: Safe files can enter quarantine; direct permanent deletion remains disabled.
  retention_days:
    name: Quarantine retention
    description: Days files remain recoverable in quarantine before explicit deletion becomes available.
  advanced_mode:
    name: Advanced inventory
    description: Show technical details without bypassing safety gates.
  report_retention_count:
    name: Reports to retain
    description: Complete scan report sets kept in app data.
  language:
    name: Language
    description: Choose automatic, Dutch or English for the Hass-Cleaner interface.
