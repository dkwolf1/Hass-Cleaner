name: Hass-Cleaner
version: "1.1.0"
slug: hass_cleaner
description: Storage audit and controlled cleanup for Home Assistant OS
url: https://github.com/dkwolf1/Hass-Cleaner
arch:
  - amd64
  - aarch64
init: false
ingress: true
panel_icon: mdi:broom
image: "ghcr.io/dkwolf1/hass-cleaner"
homeassistant_api: true
hassio_api: true
hassio_role: backup
map:
  - type: homeassistant_config
    read_only: false
options:
  min_temp_age_days: 30
  min_log_age_days: 14
  retention_days: 7
  advanced_mode: false
  report_retention_count: 10
  language: auto
schema:
  min_temp_age_days: int(1,365)
  min_log_age_days: int(1,365)
  retention_days: int(1,10)
  advanced_mode: bool
  report_retention_count: int(1,50)
  language: list(auto|nl|en)
