name: Bug melden
description: Meld een reproduceerbaar probleem zonder persoonlijke gegevens of geheimen.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Deel geen tokens, secrets.yaml of onbewerkte auditrapporten.
  - type: input
    id: version
    attributes:
      label: Hass-Cleaner-versie
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Probleem en stappen om te reproduceren
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Verwacht gedrag
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacycontrole
      options:
        - label: Ik heb tokens, wachtwoorden, persoonlijke namen en paden verwijderd.
          required: true
